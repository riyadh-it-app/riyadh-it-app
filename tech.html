<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Technician Radar - Riyadh</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        .tech-container { max-width: 480px; margin: 0 auto; }
        .header { text-align: center; font-size: 20px; font-weight: bold; color: #38bdf8; padding: 15px 0; border-bottom: 1px solid #334155; }
        .job-card { background: #1e293b; border-radius: 12px; padding: 15px; margin-top: 15px; border: 1px solid #334155; position: relative; }
        .emergency-badge { position: absolute; top: 15px; right: 15px; background: #ef4444; color: white; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 6px; }
        .job-title { font-size: 16px; font-weight: bold; color: #f1f5f9; margin-bottom: 8px; border-bottom: 1px dashed #334155; padding-bottom: 5px; }
        .job-detail { font-size: 14px; color: #94a3b8; margin: 5px 0; }
        .code-vault { background: #334155; color: #facc15; padding: 6px; border-radius: 6px; display: inline-block; font-weight: bold; font-family: monospace; margin-top: 5px; }
        .rate-badge { color: #4ade80; font-weight: bold; font-size: 18px; margin-top: 10px; }
        button.accept-btn { width: 100%; padding: 12px; background: #10b981; color: white; border: none; font-weight: bold; border-radius: 8px; margin-top: 12px; cursor: pointer; }
        .empty-state { text-align: center; color: #64748b; padding: 40px 0; font-size: 14px; }
    </style>
</head>
<body>

<div class="tech-container">
    <div class="header">🛠️ Live Jobs Radar Terminal</div>
    <div id="radarFeed">
        <div class="empty-state">🔄 Monitoring Riyadh for active incoming client signals...</div>
    </div>
</div>

<script>
    var supabaseClient = null;
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable__JhviMZB09mCgpcekV1zxA_HjwRPvSo";

    window.onload = function() {
        if (window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            listenToLiveJobs();
            supabaseClient.channel('schema-db-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'jobs' }, () => { listenToLiveJobs(); }).subscribe();
        }
    };

    async function listenToLiveJobs() {
        if (!supabaseClient) return;
        const { data: activeJobs } = await supabaseClient.from('jobs').select('*').eq('job_status', 'PENDING').order('created_at', { ascending: false });
        renderJobs(activeJobs);
    }

    function renderJobs(jobsList) {
        const feed = document.getElementById('radarFeed');
        if (!jobsList || jobsList.length === 0) {
            feed.innerHTML = '<div class="empty-state">🔄 Monitoring Riyadh for active incoming client signals...</div>';
            return;
        }
        feed.innerHTML = ''; 
        jobsList.forEach(job => {
            const card = document.createElement('div');
            card.className = 'job-card';
            let emergencyTag = job.is_emergency ? '<span class="emergency-badge">🚨 EMERGENCY</span>' : '';
            
            // Calculate security hash mapping from timestamps to prevent disturbances
            const derivedId = "REQ-" + (1000 + (job.job_id % 9000));

            card.innerHTML = `
                ${emergencyTag}
                <div class="job-title">🛠️ ${job.service_type.replace('_', ' ')}</div>
                <div class="job-detail">👤 <b>Client:</b> ${job.client_name}</div>
                <div class="job-detail">📞 <b>Phone:</b> <a href="tel:${job.client_phone}" style="color:#38bdf8;">${job.client_phone}</a></div>
                <div class="job-detail">🔒 <b>Match WhatsApp Code:</b> <span class="code-vault">${derivedId}</span></div>
                <div class="rate-badge">${job.hourly_rate} SAR / hour</div>
                <button class="accept-btn" onclick="acceptJobTicket(${job.job_id})">⚡ Accept Job Dispatch</button>
            `;
            feed.appendChild(card);
        });
    }

    async function acceptJobTicket(id) {
        const { error } = await supabaseClient.from('jobs').update({ job_status: 'ACCEPTED' }).eq('job_id', id);
        if (!error) alert("🚀 Ticket Claimed! Call the client to coordinate arrival.");
    }
</script>
</body>
</html>
