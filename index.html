<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riyadh On-Demand IT & CCTV Marketplace</title>
    <!-- Securely loading the real-time Supabase library from global CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-client: #f0f2f5;
            --bg-tech: #0f172a;
            --card-client: #ffffff;
            --card-tech: #1e293b;
            --text-client: #1a1a1a;
            --text-tech: #f8fafc;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; transition: background 0.3s; }
        .app-container { max-width: 480px; margin: 0 auto; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 20px; background: white; color: #1a1a1a; }
        .header { text-align: center; font-weight: bold; font-size: 22px; margin-bottom: 15px; }
        .mode-toggle { text-align: center; margin-bottom: 20px; }
        .mode-btn { padding: 6px 12px; font-size: 12px; font-weight: bold; border-radius: 20px; border: 1px solid #ccd4d9; background: #e2e8f0; cursor: pointer; margin: 0 5px; }
        .mode-btn.active { background: #007bff; color: white; border-color: #007bff; }
        .card { background: #f7f9fa; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #eef1f2; color: inherit; }
        select, input, button { width: 100%; padding: 14px; margin-top: 8px; border-radius: 10px; border: 1px solid #ccd4d9; font-size: 16px; box-sizing: border-box; display: block; text-align: center; }
        select, input { background: white; font-weight: 500; color: #1a1a1a; }
        .emergency-box { background: #fff3cd; border: 1px solid #ffeeba; border-radius: 12px; padding: 12px; display: flex; align-items: center; margin: 15px 0; color: #856404; }
        .emergency-box input { width: 22px; height: 22px; margin-right: 12px; cursor: pointer; }
        .emergency-box label { font-weight: bold; font-size: 15px; cursor: pointer; color: inherit; }
        .rate-display { font-size: 24px; font-weight: 800; color: #28a745; text-align: center; margin: 15px 0; }
        button.verify-btn { background: #10b981; color: white; border: none; font-weight: 700; margin-bottom: 10px; cursor: pointer; }
        button.dispatch-btn { background: #007bff; color: white; border: none; font-weight: 700; cursor: pointer; }
        button.dispatch-btn:disabled { background: #cbd5e1; cursor: not-allowed; color: #64748b; }
        .status-log { background: #1e293b; color: #38bdf8; font-family: monospace; padding: 12px; border-radius: 10px; font-size: 12px; max-height: 100px; overflow-y: auto; text-align: left; }
        
        /* Dark Theme overrides for Technician Dashboard mode */
        body.dark-mode { background: var(--bg-tech); }
        body.dark-mode .app-container { background: var(--card-tech); color: var(--text-tech); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        body.dark-mode .card { background: #0f172a; border-color: #334155; }
        .job-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 15px; margin-top: 15px; position: relative; text-align: left; }
        .emergency-badge { position: absolute; top: 15px; right: 15px; background: #ef4444; color: white; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 6px; }
        .job-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; border-bottom: 1px dashed #334155; padding-bottom: 5px; }
        .job-detail { font-size: 14px; color: #94a3b8; margin: 5px 0; }
        button.accept-btn { width: 100%; padding: 12px; background: #10b981; color: white; border: none; font-weight: bold; border-radius: 8px; margin-top: 12px; cursor: pointer; }
        .empty-state { text-align: center; color: #64748b; padding: 40px 0; font-size: 14px; }
    </style>
</head>
<body class="light-mode">

<div class="app-container">
    <!-- View Switcher -->
    <div class="mode-toggle">
        <button id="btnClient" class="mode-btn active" onclick="switchView('client')">Customer App</button>
        <button id="btnTech" class="mode-btn" onclick="switchView('tech')">Technician Radar</button>
    </div>

    <!-- 📱 CLIENT APP SCREEN CONTAINER -->
    <div id="clientScreen">
        <div class="header">📱 Riyadh IT & CCTV On-Demand</div>
        <div class="card">
            <label style="font-weight:600; color:#4a5568;">Your Name / Business Name:</label>
            <input type="text" id="clientName" placeholder="e.g. Al-Malqa Cafe / Khalid">
            
            <label style="font-weight:600; color:#4a5568; margin-top: 12px; display:block;">Your Mobile Number:</label>
            <input type="tel" id="clientPhone" placeholder="e.g. 05XXXXXXXX">

            <label style="font-weight:600; color:#4a5568; margin-top: 12px; display:block;">Your Email Address:</label>
            <input type="email" id="clientEmail" placeholder="name@business.com">
        </div>
        
        <div class="card">
            <label style="font-weight:600; color:#4a5568;">Select Required Technical Support:</label>
            <select id="serviceType">
                <option value="CCTV_INSTALL">IP CCTV Surveillance Setup (HCIS Rules)</option>
                <option value="NETWORKING">Cisco/Ubiquiti Network Repair (CCNA)</option>
                <option value="FIBER_FTTH">Fiber Optic Structured Cabling / FTTH</option>
            </select>
        </div>
        
        <div class="emergency-box">
            <input type="checkbox" id="emergencyToggle" onchange="calculateLiveRate()">
            <label for="emergencyToggle">🚨 Emergency Job (Arrive in 60 mins)</label>
        </div>
        <div class="rate-display" id="rateText">Live Rate: 120 SAR / hr</div>
        
        <!-- Free Email verification fields -->
        <button class="verify-btn" id="emailSendBtn" onclick="sendVerificationEmail()">📧 Step 1: Send Verification Code</button>
        
        <div id="pinVerificationSection" style="display:none; margin-top: 10px;">
            <input type="number" id="userPinInput" placeholder="Enter 4-digit code from your email">
            <button class="verify-btn" style="background:#059669;" onclick="validateEmailPin()">Verify Code</button>
        </div>
        
        <button class="dispatch-btn" id="dispatchBtn" onclick="sendJobRequest()" disabled>📍 Request Dispatch</button>
        <p style="font-weight:600; font-size:14px; margin-top:20px; color:#4a5568;">System Radar Terminal Logs:</p>
        <div class="status-log" id="logTerminal">Please verify your email address to book a tech.</div>
    </div>

    <!-- 🛠️ TECHNICIAN RADAR CONTAINER -->
    <div id="techScreen" style="display: none;">
        <div class="header" style="color:#38bdf8;">🛠️ Live Jobs Radar Terminal</div>
        <div id="radarFeed">
            <div class="empty-state">🔄 Monitoring Riyadh for active incoming client signals...</div>
        </div>
    </div>
</div>

<script>
    var supabaseClient = null;
    var realtimeChannel = null;
    var generatedPin = "";
    
    // ⚠️ CONFIGURATION: Replace this string with your real cPanel domain url path
    const CPANEL_PROXY_URL = "https://anamnet.com";

    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable__JhviMZB09mCgpcekV1zxA_HjwRPvSo";

    function checkDatabaseConnection() {
        if (window.supabase && !supabaseClient) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
        return supabaseClient;
    }

    window.onload = function() {
        checkDatabaseConnection();
        generatedPin = Math.floor(1000 + Math.random() * 9000).toString();
        if(window.location.hash === '#tech') {
            switchView('tech');
        }
    };

    function switchView(mode) {
        checkDatabaseConnection();
        if (mode === 'client') {
            document.body.className = "light-mode";
            document.getElementById('clientScreen').style.display = 'block';
            document.getElementById('techScreen').style.display = 'none';
            document.getElementById('btnClient').className = 'mode-btn active';
            document.getElementById('btnTech').className = 'mode-btn';
            if(realtimeChannel) { realtimeChannel.unsubscribe(); realtimeChannel = null; }
        } else {
            document.body.className = "dark-mode";
            document.getElementById('clientScreen').style.display = 'none';
            document.getElementById('techScreen').style.display = 'block';
            document.getElementById('btnClient').className = 'mode-btn';
            document.getElementById('btnTech').className = 'mode-btn active';
            listenToLiveJobs();
        }
    }

    function calculateLiveRate() {
        const isEmergency = document.getElementById('emergencyToggle').checked;
        let activeRate = 120;
        const now = new Date();
        const hour = now.getHours();
        const day = now.getDay(); 

        if (isEmergency) activeRate = 250;
        else {
            if (day === 5) activeRate = 250;
            else if ((hour >= 7 && hour < 9) || (hour >= 15 && hour < 19)) activeRate = 180;
        }
        document.getElementById('rateText').innerText = `Live Rate: ${activeRate} SAR / hr`;
        return activeRate;
    }

    // Sends the request payload securely through your cPanel script routing
    async function sendVerificationEmail() {
        const email = document.getElementById('clientEmail').value.trim();
        const name = document.getElementById('clientName').value.trim();
        const phone = document.getElementById('clientPhone').value.trim();
        const terminal = document.getElementById('logTerminal');
